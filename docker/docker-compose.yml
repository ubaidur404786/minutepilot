# MinutePilot stack: n8n (+ its PostgreSQL) and the Python service (chat page + audio/photo work).
# Ollama runs natively on Windows (GPU); containers reach it at host.docker.internal:11434.
# Start:  docker compose --env-file .env up -d     (run inside the docker/ folder)

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d n8n"]
      interval: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:2.44.6
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
      N8N_WEBHOOK_URL: http://localhost:5678/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # slow laptop: give the Code-node task runner more time to start
      N8N_RUNNERS_GRANT_TOKEN_TTL: "120"
      # save each node as it finishes, so a running execution can be watched in the Executions tab
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "true"
      # our workflows read the MINUTEPILOT_* settings below with $env
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      MINUTEPILOT_OWNER_EMAIL: ${OWNER_EMAIL}
      MINUTEPILOT_SHEET_ID: ${SHEET_ID}
      MINUTEPILOT_PYTHON_URL: http://python-service:8000
      MINUTEPILOT_OLLAMA_URL: http://host.docker.internal:11434
      MINUTEPILOT_TEXT_MODEL: ${TEXT_MODEL}
      MINUTEPILOT_NUM_CTX: ${NUM_CTX}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../n8n/workflows:/workflows:ro

  python-service:
    build: ../python-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      N8N_CHAT_URL: http://n8n:5678/webhook/minutepilot-chat
      OLLAMA_URL: http://host.docker.internal:11434
      VISION_MODEL: ${VISION_MODEL}
      WHISPER_MODEL: ${WHISPER_MODEL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - python_data:/data

volumes:
  postgres_data:
  n8n_data:
  python_data:
